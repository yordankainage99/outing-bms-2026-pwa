<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#17324D">
  <title>OUTING BMS 2026</title>
  <style>
    *{box-sizing:border-box}html,body{height:100%;margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f2f6f9;color:#17324d}
    body{display:grid;place-items:center;padding:24px}.card{width:min(360px,100%);text-align:center;background:#fff;border:1px solid #dfe7ee;border-radius:22px;padding:26px;box-shadow:0 12px 38px rgba(10,34,55,.1)}
    img{width:88px;height:88px;object-fit:contain;border-radius:20px}.card h1{font-size:1.05rem;margin:14px 0 8px}.card p{font-size:.78rem;line-height:1.55;color:#667989}
    button{border:0;border-radius:12px;background:#17324d;color:#fff;padding:11px 16px;font-weight:800}
  </style>
</head>
<body>
  <div class="card">
    <img src="/icon-192-v3.png" alt="Logo BMS">
    <h1>Tidak ada koneksi internet</h1>
    <p>Shell aplikasi sudah tersedia, tetapi data Outing tetap membutuhkan koneksi ke Google Apps Script.</p>
    <button onclick="location.reload()">Coba Lagi</button>
  </div>
</body>
</html>
