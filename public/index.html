<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#17324D">
  <meta name="color-scheme" content="light">
  <title>OUTING BMS 2026</title>
  <meta name="description" content="Outing Management System — Batavia Madrigal Singers 2026">

  <!-- Mulai koneksi ke Google seawal mungkin. Tidak menunggu request branding/API. -->
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
  <link rel="dns-prefetch" href="//script.google.com">
  <link rel="dns-prefetch" href="//script.googleusercontent.com">

  <!-- PWA: semua icon berupa PNG statis agar Android/iPhone stabil. -->
  <link rel="manifest" href="/manifest-v3.webmanifest">
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48-v3.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-v3.png">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Outing BMS">
  <meta name="mobile-web-app-capable" content="yes">

  <link rel="stylesheet" href="/styles-v3.css">
</head>
<body>
  <main class="shell">
    <!--
      PENTING:
      iframe langsung memiliki src pada HTML.
      Browser mulai memuat Apps Script saat HTML sedang diparsing.
      Tidak ada lagi /api/config -> Apps Script branding -> iframe.
    -->
    <iframe
      id="outingFrame"
      class="outing-frame"
      src="https://script.google.com/macros/s/AKfycbww72FI3QS3D1vNZkgpLG8h4D12M3_C-v3GVx4PUYKfTvLXWEt_O24dm5dFb8oktslf/exec"
      title="OUTING BMS 2026"
      referrerpolicy="strict-origin-when-cross-origin"
      allow="clipboard-read; clipboard-write; fullscreen"
      allowfullscreen
    ></iframe>

    <section id="splash" class="splash" aria-live="polite">
      <div class="splash-card">
        <img class="brand-logo" src="/brand-logo-v3.png" alt="Batavia Madrigal Singers">
        <h1>OUTING BMS 2026</h1>
        <p>7–8 November 2026</p>
        <div class="loader" aria-hidden="true"></div>
        <span id="loadingText">Membuka aplikasi…</span>
      </div>
    </section>

    <button id="installButton" class="install-button" type="button" hidden>
      <span aria-hidden="true">＋</span>
      Pasang Aplikasi
    </button>

    <section id="iosInstallSheet" class="install-sheet" hidden>
      <button class="sheet-backdrop" type="button" data-close-install aria-label="Tutup"></button>
      <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="installTitle">
        <div class="sheet-handle"></div>
        <img src="/icon-192-v3.png" alt="" class="sheet-icon">
        <h2 id="installTitle">Pasang Outing BMS</h2>
        <p>Di iPhone/iPad, gunakan Safari lalu:</p>
        <ol>
          <li>Tekan tombol <strong>Share</strong>.</li>
          <li>Pilih <strong>Add to Home Screen</strong>.</li>
          <li>Tekan <strong>Add</strong>.</li>
        </ol>
        <button class="sheet-close" type="button" data-close-install>Mengerti</button>
      </div>
    </section>

    <section id="slowPanel" class="slow-panel" hidden>
      <div class="slow-card">
        <strong>Masih memuat aplikasi…</strong>
        <span>Koneksi ke Google Apps Script membutuhkan waktu lebih lama dari biasanya.</span>
      </div>
    </section>
  </main>

  <script src="/app-v3.js" defer></script>
</body>
</html>
