<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#17324D">
  <meta name="color-scheme" content="light">
  <title>OUTING BMS 2026</title>
  <meta name="description" content="Aplikasi Outing BMS 2026">
  <link rel="manifest" href="/manifest">
  <link id="appIcon" rel="icon" href="/icon/192">
  <link id="appleIcon" rel="apple-touch-icon" href="/icon/180">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Outing BMS">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main id="shell" class="shell">
    <section id="splash" class="splash" aria-live="polite">
      <div class="splash-card">
        <img id="splashLogo" class="splash-logo" src="/icon/192" alt="Logo Outing BMS">
        <h1 id="splashTitle">OUTING BMS 2026</h1>
        <p id="splashDate">7–8 November 2026</p>
        <div class="loader" aria-hidden="true"></div>
        <p id="splashStatus" class="splash-status">Membuka aplikasi…</p>
      </div>
    </section>

    <iframe id="outingFrame" class="outing-frame" title="OUTING BMS 2026" referrerpolicy="strict-origin-when-cross-origin" allow="clipboard-read; clipboard-write; fullscreen" allowfullscreen></iframe>

    <button id="installButton" class="install-button" type="button" hidden><span aria-hidden="true">＋</span>Pasang Aplikasi</button>

    <section id="iosInstallSheet" class="install-sheet" hidden>
      <button class="sheet-backdrop" type="button" data-close-install aria-label="Tutup"></button>
      <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="installTitle">
        <div class="sheet-handle"></div>
        <h2 id="installTitle">Pasang di iPhone</h2>
        <p>Buka halaman ini menggunakan Safari, lalu:</p>
        <ol><li>Tekan tombol <strong>Share</strong> di Safari.</li><li>Pilih <strong>Add to Home Screen</strong>.</li><li>Tekan <strong>Add</strong>.</li></ol>
        <button class="sheet-close" type="button" data-close-install>Mengerti</button>
      </div>
    </section>

    <section id="errorPanel" class="error-panel" hidden>
      <div class="error-card">
        <h2>Aplikasi belum dapat dibuka</h2>
        <p id="errorText">Periksa konfigurasi Cloudflare Pages.</p>
        <div class="error-actions"><button id="retryButton" type="button">Coba Lagi</button><a id="directLink" href="#" target="_blank" rel="noopener" hidden>Buka Apps Script</a></div>
      </div>
    </section>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
